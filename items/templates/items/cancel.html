<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оплата отменена</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        .cancel-icon {
            font-size: 64px;
            color: rgb(255, 25, 0);
            margin-bottom: 20px;
        }
        h1 {
            color: rgb(255, 25, 0);
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin-top: 30px;
            background: rgb(0, 25, 255);
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .btn:hover {
            background: rgb(0, 25, 255);
        }
    </style>
</head>
<body>
    <div class="cancel-icon">✘</div>
    <h1>Оплата отменена</h1>
    <p>Ваш платёж не был завершён.</p>
    <a href="/" class="btn">Вернуться в магазин</a>
</body>
</html>
