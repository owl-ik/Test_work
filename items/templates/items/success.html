<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>УРА ПОЗДРАВЛЯЕМ С ПОКУПКОЙ!</title>
    <style>
        body {
            text-align: center;
            margin-top: 100px;
            background-color: rgb(255, 255, 255);
        }
        .success-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgb(0,0,0);
        }
        .success-icon {
            font-size: 64px;
            color: green;
            margin-bottom: 20px;
        }
        h1 {
            color: green;
            margin-bottom: 10px;
        }
        p {
            color: rgb(0, 0, 0);
            line-height: 1.6;
        }
        .return-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background-color: rgb(0, 21, 255);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .return-link:hover {
            background-color: rgb(0, 21, 255);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">✓</div>
        <h1>Оплата прошла успешно!</h1>
        <p>Спасибо что выбрали нас!</p>
        <p>На вашу почту придёт чек с описанием.</p>
        <a href="/" class="return-link">Вернуться на главную</a>
    </div>
</body>
</html>
